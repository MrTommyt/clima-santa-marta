# Connection settings come from the same POSTGRES_* env vars the rest of the
# platform uses; defaults match .env.example. Nothing secret lives here.
clima:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'clima') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'clima-local-dev') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'clima') }}"
      schema: gold
      threads: 4
