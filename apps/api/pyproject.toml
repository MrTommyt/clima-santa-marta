[project]
name = "clima-api"
version = "0.1.0"
description = "FastAPI backend for the Santa Marta climate platform"
requires-python = ">=3.12"
dependencies = [
    # Lower bound only: Airflow's task-sdk caps fastapi (<0.137 today), and
    # the workspace shares one resolution. Revisit if the API ever needs a
    # newer fastapi than Airflow permits.
    "fastapi>=0.129",
    "uvicorn[standard]~=0.52",
    "pydantic-settings~=2.14",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
