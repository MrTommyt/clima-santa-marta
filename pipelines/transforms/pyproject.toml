[project]
name = "clima-transforms"
version = "0.1.0"
description = "Bronze-to-silver transforms, run as Airflow tasks"
requires-python = ">=3.12"
dependencies = [
    "clima-shared",
    "clima-db",
    "sqlalchemy~=2.0",
]

[tool.uv.sources]
clima-shared = { workspace = true }
clima-db = { workspace = true }

[tool.uv.build-backend]
module-name = "clima_transforms"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
