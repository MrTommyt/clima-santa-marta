[project]
name = "clima-shared"
version = "0.1.0"
description = "Shared library for ingestion services and pipelines"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka",
    "httpx",
    "minio",
    "pyyaml",
    "tenacity",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
