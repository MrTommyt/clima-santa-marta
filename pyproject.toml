[project]
name = "clima-santa-marta"
version = "0.1.0"
description = "Santa Marta climate intelligence platform"
requires-python = ">=3.12,<3.13"
# Members are root dependencies so a plain `uv sync` installs the whole
# workspace instead of uninstalling everything but the dev group.
dependencies = [
    "clima-airflow",
    "clima-api",
    "clima-ingestion-openmeteo",
    "clima-ingestion-ideam",
    "clima-ingestion-metar",
    "clima-ingestion-nasa-power",
    "clima-shared",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "services/*", "pipelines/shared", "pipelines/airflow"]

[tool.uv.sources]
clima-airflow = { workspace = true }
clima-api = { workspace = true }
clima-ingestion-openmeteo = { workspace = true }
clima-ingestion-ideam = { workspace = true }
clima-ingestion-metar = { workspace = true }
clima-ingestion-nasa-power = { workspace = true }
clima-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff~=0.16.1",
    "mypy~=2.3",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "httpx~=0.28",
    "pre-commit~=4.6",
    "testcontainers~=4.15",
    "types-pyyaml",
    "psycopg[binary]~=3.3",
    "redis~=8.1",
    "boto3~=1.40",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "N", "A", "RUF", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "services", "pipelines"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["apps", "services", "pipelines", "tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires the local docker compose stack (make dev)",
    "data_quality: data-quality validation suites",
    "e2e: end-to-end tests",
]

# Tell Ruff to fix fixable violations automatically on save
fixable = ["ALL"]
