[project]
name = "clima-santa-marta"
version = "0.1.0"
description = "Santa Marta climate intelligence platform"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "services/*", "pipelines/shared"]

[dependency-groups]
dev = [
    "ruff~=0.16.1",
    "mypy~=2.3",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "httpx~=0.28",
    "pre-commit~=4.6",
    "testcontainers~=4.15",
    "psycopg[binary]~=3.3",
    "redis~=6.4",
    "boto3~=1.40",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "services", "pipelines"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["apps", "services", "pipelines", "tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires the local docker compose stack (make dev)",
    "data_quality: data-quality validation suites",
    "e2e: end-to-end tests",
]
