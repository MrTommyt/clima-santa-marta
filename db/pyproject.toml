[project]
name = "clima-db"
version = "0.1.0"
description = "Operational schema (metadata + silver): SQLAlchemy models and Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "alembic~=1.19",
    "sqlalchemy~=2.0",
    "psycopg[binary]~=3.3",
]

[tool.uv.build-backend]
module-name = "clima_db"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
