[project]
name = "clima-ingestion-ideam"
version = "0.1.0"
description = "IDEAM ingestion service (Milestone 6)."
requires-python = ">=3.12"
dependencies = ["clima-shared"]

[tool.uv.sources]
clima-shared = { workspace = true }

[tool.uv.build-backend]
module-name = "ingestion_ideam"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
