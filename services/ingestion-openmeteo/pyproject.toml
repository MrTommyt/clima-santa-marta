[project]
name = "clima-ingestion-openmeteo"
version = "0.1.0"
description = "Open-Meteo ingestion service (Milestones 2 and 6)."
requires-python = ">=3.12"
dependencies = ["clima-shared"]

[tool.uv.sources]
clima-shared = { workspace = true }

[tool.uv.build-backend]
module-name = "ingestion_openmeteo"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
