[project]
name = "clima-ingestion-metar"
version = "0.1.0"
description = "SKSM METAR ingestion service (Milestone 2)."
requires-python = ">=3.12"
dependencies = ["clima-shared"]

[tool.uv.sources]
clima-shared = { workspace = true }

[tool.uv.build-backend]
module-name = "ingestion_metar"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
